[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosopon"
version = "0.1.0"
description = "Production-grade local text and voice interface for Metis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Metis Prosopon Authors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.4.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "cryptography>=42.0.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "webauthn>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
prosopon = "prosopon.cli:cli"

[tool.setuptools.packages.find]
include = ["prosopon*"]

[tool.setuptools.package-data]
prosopon = ["web/static/**/*", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
