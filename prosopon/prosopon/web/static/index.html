<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prosopon — Local Interface</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="dark-theme">
  <div id="app" class="app-container">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <button id="btn-toggle-sidebar" class="icon-btn" aria-label="Toggle sessions menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="nav-title">
        <h1 id="session-title">New Conversation</h1>
        <span id="connection-status" class="status-badge connected">Local</span>
      </div>
      <button id="btn-pairing-info" class="icon-btn" aria-label="Device pairing info">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
    </header>

    <!-- Sidebar / Session Drawer -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Sessions</h2>
        <button id="btn-new-session" class="btn primary-btn">+ New Chat</button>
      </div>
      <ul id="session-list" class="session-list" role="list">
        <!-- Rendered dynamically -->
      </ul>
      <div class="sidebar-footer">
        <div id="auth-status-panel" class="auth-panel">
          <small id="auth-state-text">Loopback Mode</small>
        </div>
      </div>
    </aside>
    <div id="sidebar-overlay" class="overlay"></div>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace">
      <div id="message-container" class="message-container" role="log" aria-live="polite">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Live Phylax Approval Card Container -->
      <div id="approval-dock" class="approval-dock"></div>

      <!-- Bottom Action Bar / Composer -->
      <footer class="composer-bar">
        <!-- Push-to-Talk Mic Button -->
        <button id="btn-ptt" class="ptt-btn" aria-label="Push to talk (Hold to speak)">
          <svg class="mic-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <form id="chat-form" class="composer-form">
          <label for="prompt-input" class="sr-only">Your message</label>
          <input 
            type="text" 
            id="prompt-input" 
            class="prompt-input" 
            placeholder="Ask Metis or hold mic..." 
            autocomplete="off"
            required
          />
          <button type="submit" id="btn-send" class="icon-btn send-btn" aria-label="Send message">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </footer>
    </main>

    <!-- Transcript Confirmation Modal (Voice confirmation before execution) -->
    <div id="transcript-modal" class="modal">
      <div class="modal-card">
        <h3>Confirm Voice Query</h3>
        <textarea id="voice-transcript-text" class="transcript-textarea"></textarea>
        <div class="modal-actions">
          <button id="btn-cancel-voice" class="btn secondary-btn">Cancel</button>
          <button id="btn-confirm-voice" class="btn primary-btn">Send Query</button>
        </div>
      </div>
    </div>

    <!-- Pairing PIN Modal -->
    <div id="pairing-modal" class="modal">
      <div class="modal-card">
        <h3>Device Pairing</h3>
        <p>Enter the 6-digit PIN displayed on your Metis server console:</p>
        <input type="text" id="pairing-pin-input" class="pin-input" maxlength="6" placeholder="123456" />
        <div class="modal-actions">
          <button id="btn-close-pairing" class="btn secondary-btn">Close</button>
          <button id="btn-submit-pairing" class="btn primary-btn">Authorize Phone</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Local Self-Contained JavaScript -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/audio.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
