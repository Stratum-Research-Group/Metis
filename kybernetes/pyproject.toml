[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kybernetes"
version = "0.1.0"
description = "Kybernetes: Local assistant orchestrator and steersman for the Metis ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Metis Core Team" }
]
dependencies = [
    "pydantic>=2.4.0",
    "click>=8.1.7",
    "tabulate>=0.9.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "sse-starlette>=1.6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
kybernetes = "kybernetes.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
