# Hestia service configuration
# ─────────────────────────────

# Host the Hestia API binds to (local-only)
listen_host: 127.0.0.1

# Port the Hestia API listens on
listen_port: 8080

# Path to the llama-server binary (llama.cpp)
llamacpp_binary: /home/akarta/.unsloth/llama.cpp/llama-server

# Port range for spawned llama.cpp backend processes.
# Each loaded model gets the next free port in this range.
backend_port_range:
  start: 9000
  end: 9019

# Seconds of inactivity before a model is automatically unloaded to free VRAM.
idle_timeout_seconds: 600

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: INFO
