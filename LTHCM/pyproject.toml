[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lthcm"
version = "0.1.0"
description = "Long-Term High-Capacity Topological & Non-Euclidean Memory Engine for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LTHCM Authors" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
bench = [
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.7.4",
    "rank_bm25>=0.2.2",
    "pytrec_eval-terrier>=0.5.10",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "nltk>=3.8.0",
    "beir>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
]
all = [
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.7.4",
    "rank_bm25>=0.2.2",
    "pytrec_eval-terrier>=0.5.10",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "nltk>=3.8.0",
    "beir>=2.0.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["lthcm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
