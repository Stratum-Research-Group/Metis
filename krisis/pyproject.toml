[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krisis"
version = "0.1.0"
description = "Krisis: Answer selector, eligibility gates, and quality scoring engine for the Metis ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Metis Core Team" }
]
dependencies = [
    "pydantic>=2.4.0",
    "jsonschema>=4.18.0",
    "click>=8.1.7",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
krisis = "krisis.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
