[project]
name = "metis-stack"
version = "0.1.0"
description = "Metis sovereign local AI cognitive and multi-agent stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kybernetes",
    "prosopon",
    "hestia",
    "phylax",
    "krisis",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "tabulate>=0.9.0",
    "networkx>=3.0",
    "openai>=1.0.0",
    "pypdf>=3.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "stoma",
    "LTHCM",
    "dianoia",
    "hestia",
    "dokime",
    "kleroterion",
    "krisis",
    "kybernetes",
    "paideia",
    "phylax",
    "prosopon",
]

[tool.uv.sources]
lthcm = { workspace = true }
dianoia = { workspace = true }
kybernetes = { workspace = true }
prosopon = { workspace = true }
hestia = { workspace = true }
phylax = { workspace = true }
krisis = { workspace = true }
stoma = { workspace = true }
dokime = { workspace = true }
kleroterion = { workspace = true }
paideia = { workspace = true }

[tool.pytest.ini_options]
norecursedirs = [
    "harness/references",
    ".venv",
    ".git",
    ".metis",
    "dist",
    "build",
]
pythonpath = [
    "kleroterion/src",
    "kleroterion",
    "dokime/src",
    "hestia/src",
    "stoma/src",
    "dianoia",
    "paideia",
    "LTHCM",
    "kybernetes",
    "prosopon",
    "phylax",
    "krisis",
    "schedion",
    "symbolon",
    ".",
]
