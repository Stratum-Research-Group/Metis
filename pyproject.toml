[project]
name = "metis-stack"
version = "0.1.0"
description = "Metis sovereign local AI cognitive and multi-agent stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kybernetes",
    "prosopon",
    "hestia",
    "phylax",
    "krisis",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "stoma",
    "LTHCM",
    "dianoia",
    "hestia",
    "dokime",
    "kleroterion",
    "krisis",
    "kybernetes",
    "paideia",
    "phylax",
    "prosopon",
]

[tool.uv.sources]
lthcm = { workspace = true }
dianoia = { workspace = true }
kybernetes = { workspace = true }
prosopon = { workspace = true }
hestia = { workspace = true }
phylax = { workspace = true }
krisis = { workspace = true }
stoma = { workspace = true }
dokime = { workspace = true }
kleroterion = { workspace = true }
paideia = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "dianoia",
    "paideia",
    "stoma/src",
    "LTHCM",
    "dokime",
    "kleroterion",
]
