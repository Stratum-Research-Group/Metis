[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kleroterion"
version = "0.1.0"
description = "Stochastic decision submodule for the stack with Dianoia as first consumer"
readme = "Kleroterion_stochastic_decision_submodule.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Kleroterion Contributors" },
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kleroterion", "adapters", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
